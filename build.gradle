tasks.register('verifyGoldenClient') {
    group = 'verification'
    description = 'Runs the complete client export and semantic golden comparison.'
    dependsOn 'recordGoldenRun'
    doLast {
        def expectedProperty = providers.gradleProperty('goldenExpected').orNull
        def canonicalExpected = rootProject.file(
                "golden/baselines/${goldenTargetName}/${goldenScenario}/${goldenVariantName}/semantic.snapshot.json")
        def legacyName = goldenVariantName == 'default'
                ? "${goldenScenario}.snapshot.json"
                : "${goldenScenario}.${goldenVariantName}.snapshot.json"
        def legacyExpected = rootProject.file("golden/expected/${goldenTarget.minecraft}/${legacyName}")
        def expected = expectedProperty != null
                ? rootProject.file(expectedProperty)
                : (canonicalExpected.isFile() ? canonicalExpected : legacyExpected)
        def actual = new File(goldenRunRoot, 'actual.snapshot.json')
        if (!expected.isFile()) {
            logger.lifecycle("No approved semantic baseline yet; review is pending: ${expected}")
            return
        }
        def expectedJson = new JsonSlurper().parse(expected)
        def actualJson = new JsonSlurper().parse(actual)
        if (expectedJson != actualJson) {
            throw new GradleException("Golden snapshot mismatch. Expected: ${expected}; actual: ${actual}")
        }
        logger.lifecycle("Golden snapshot verified: ${expected}")
    }
}

