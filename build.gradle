def modMatrixDefinitions = [
        [target: 'fabric-1.21.11', scenario: 'render_features', variant: 'atlas',
         pack: 'fabric-1.21.11-continuity'],
        [target: 'fabric-1.21.11', scenario: 'render_features', variant: 'atlas',
