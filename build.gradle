tasks.register('validateGoldenDefinitions') {
    group = 'verification'
    description = 'Validates golden scenario v2 manifests and reports missing versioned worlds.'
    doLast {
        def scenarioDirs = file('golden/scenarios').listFiles()?.findAll { it.isDirectory() } ?: []
        scenarioDirs.sort { it.name }.each { scenarioDir ->
            def manifestFile = new File(scenarioDir, 'scenario.json')
            def commandFile = new File(scenarioDir, 'scene.mcfunction')
            if (!manifestFile.exists() && !commandFile.exists()) {
                logger.warn("Ignoring empty golden scenario directory: ${scenarioDir}")
                return
            }
            if (!manifestFile.isFile() || !commandFile.isFile()) {
                throw new GradleException("Golden scenario requires scenario.json and scene.mcfunction: ${scenarioDir}")
            }
            def manifest = new JsonSlurper().parse(manifestFile)
            if ((manifest.schemaVersion as int) != 2) {
                throw new GradleException("Golden scenario must use schemaVersion 2: ${manifestFile}")
            }
            if (manifest.id?.toString() != scenarioDir.name) {
                throw new GradleException("Golden scenario id must match its directory: ${manifestFile}")
            }
            if (!(manifest.selection?.min instanceof List)
                    || manifest.selection.min.size() != 3
                    || !(manifest.selection?.max instanceof List)
                    || manifest.selection.max.size() != 3) {
                throw new GradleException("Golden scenario requires three-component selection min/max: ${manifestFile}")
            }
            def ids = new LinkedHashSet<String>()
            (manifest.variants ?: [[id: 'default']]).each { variant ->
                def id = variant.id?.toString()
                if (id == null || id.isBlank() || !ids.add(id)) {
                    throw new GradleException("Golden scenario variant ids must be non-empty and unique: ${manifestFile}")
                }
            }
        }

        def missingWorlds = goldenTargets.values().collect { it.minecraft }.unique().sort().findAll {
            !file("golden/worlds/${it}.zip").isFile()
        }
        if (!missingWorlds.isEmpty()) {
            logger.warn("Golden worlds still require one-time manual capture for: ${missingWorlds.join(', ')}")
        }
    }
}

tasks.register('prepareGoldenScenario') {
