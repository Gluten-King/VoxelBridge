def previousModRun = null
modMatrixDefinitions.each { definition ->
    def taskSuffix = definition.pack.replaceAll('[^A-Za-z0-9_]', '_')
    def predecessor = previousModRun
    def modTask = tasks.register("prodGoldenModCase_${taskSuffix}", GradleBuild) {
        group = 'verification/mod-matrix'
        description = "Runs locked representative Mod pack ${definition.pack}."
        dir = rootProject.projectDir
