gradle.projectsEvaluated {
    if (goldenTarget != null) {
        if (!goldenScenarioFile.isFile() || !goldenManifestFile.isFile()) {
            throw new GradleException("Missing golden scenario files under ${goldenScenarioDir}")
        }
        if (goldenVariant == null) {
            throw new GradleException("Unknown -PgoldenVariant=${goldenVariantName} for ${goldenScenario}")
        }
        def manifest = effectiveGoldenManifest()
        def pos1 = manifest.selection.min.join(',')
        def pos2 = manifest.selection.max.join(',')
        def settleTicks = (manifest.settleTicks ?: 40) as int
        def exportConfig = manifest.export ?: [:]
        def exportThreadCount = exportConfig.threadCount ?: 1
        def atlasMode = exportConfig.atlasMode ?: 'individual'
        def coordinateMode = exportConfig.coordinateMode ?: 'centered'
        def exportDoubleSided = exportConfig.containsKey('exportDoubleSided')
                ? exportConfig.exportDoubleSided
                : true
        def nonsolidCulling = exportConfig.containsKey('nonsolidCulling')
                ? exportConfig.nonsolidCulling
                : true
        def targetProject = project(goldenTarget.projectPath)
        def jarTaskName = goldenTarget.platform == 'fabric' ? 'remapJar' : 'shadowJar'
        def productionJar = targetProject.tasks.named(jarTaskName).get().archiveFile.get().asFile
        def goldenJvmArgs = [
                "-Dvoxelbridge.golden.enabled=true",
                "-Dvoxelbridge.golden.requireProductionJar=true",
                "-Dvoxelbridge.golden.expectedJar=${productionJar.absolutePath}",
                "-Dvoxelbridge.golden.scenarioFile=${goldenScenarioFile.absolutePath}",
                "-Dvoxelbridge.golden.resultFile=${goldenResultFile.absolutePath}",
                "-Dvoxelbridge.golden.exportDir=${goldenExportDir.absolutePath}",
                "-Dvoxelbridge.golden.pos1=${pos1}",
                "-Dvoxelbridge.golden.pos2=${pos2}",
                "-Dvoxelbridge.golden.settleTicks=${settleTicks}",
                "-Dvoxelbridge.golden.minecraftVersion=${goldenTarget.minecraft}",
                "-Dvoxelbridge.golden.exportThreadCount=${exportThreadCount}",
                "-Dvoxelbridge.golden.atlasMode=${atlasMode}",
                "-Dvoxelbridge.golden.coordinateMode=${coordinateMode}",
                "-Dvoxelbridge.golden.exportDoubleSided=${exportDoubleSided}",
                "-Dvoxelbridge.golden.nonsolidCulling=${nonsolidCulling}",
                "-Dvoxelbridge.golden.logging=true",
                "-Dvoxelbridge.probe.enabled=true",
                "-Dvoxelbridge.golden.timeoutSeconds=${manifest.performanceBudget?.timeoutSeconds ?: 300}",
                "-Dvoxelbridge.golden.autoStop=true"
        ]
        if (goldenScenario == 'banner_atlas') {
            // Force the structured production-mapped texture path for the
            // historical banner atlas regression.
            goldenJvmArgs += [
                    '-Dvoxelbridge.renderType.requireStructuredTexture=true',
                    '-Dvoxelbridge.banner.forceAtlasUvFallback=true'
            ]
        }
        if (goldenTarget.platform == 'neoforge') {
            targetProject.tasks.named('installGoldenProductionMod').configure {
                mustRunAfter rootProject.tasks.named('prepareGoldenMods')
            }
        }
        def runTask = targetProject.tasks.named('runGoldenProductionClient')
        runTask.configure {
            dependsOn rootProject.tasks.named('prepareGoldenWorld')
            if (goldenTarget.platform == 'fabric') {
                if (goldenModPackName != 'vanilla') {
                    mods.from(resolvedGoldenModArtifacts().collect { it.file })
                }
                jvmArgs.addAll(goldenJvmArgs)
                programArgs.addAll('--quickPlaySingleplayer', goldenWorldName)
            } else {
                jvmArgs(goldenJvmArgs)
                args '--quickPlaySingleplayer', goldenWorldName
            }
        }
    }
}
