def matrixScenarioFilter = providers.gradleProperty('goldenMatrixScenarios')
        .orElse('vanilla_smoke,render_features,banner_atlas,culling_oracle,texture_orientation,block_entity_gallery,entity_gallery,tint_fluid').get()
        .split(',').collect { it.trim() }.findAll { !it.isBlank() } as Set
def matrixTargetFilter = providers.gradleProperty('goldenMatrixTargets')
        .orElse(goldenTargets.keySet().join(',')).get()
        .split(',').collect { it.trim() }.findAll { !it.isBlank() } as Set
def matrixRuns = []
def matrixCases = []
def previousMatrixRun = null
file('golden/scenarios').listFiles()?.findAll { it.isDirectory() }?.sort { it.name }?.each { scenarioDir ->
    def manifestFile = new File(scenarioDir, 'scenario.json')
    if (!manifestFile.isFile() || !matrixScenarioFilter.contains(scenarioDir.name)) {
        return
    }
    def manifest = new JsonSlurper().parse(manifestFile)
    def supportedTargets = (manifest.targets ?: goldenTargets.keySet()) as Set
    def variants = manifest.variants ?: [[id: 'default']]
    goldenTargets.keySet().findAll { matrixTargetFilter.contains(it) && supportedTargets.contains(it) }.each { target ->
        variants.each { variant ->
            def taskSuffix = "${target}_${scenarioDir.name}_${variant.id}".replaceAll('[^A-Za-z0-9_]', '_')
            def predecessor = previousMatrixRun
            def matrixTask = tasks.register("prodGoldenCase_${taskSuffix}", GradleBuild) {
                group = 'verification/matrix'
                description = "Runs ${target}/${scenarioDir.name}/${variant.id} in an isolated nested build."
                dir = rootProject.projectDir
                tasks = ['prodGolden']
                def childProperties = new LinkedHashMap<String, String>()
                gradle.startParameter.projectProperties.each { key, value ->
                    childProperties[key.toString()] = value.toString()
                }
                childProperties.putAll([
                        goldenTarget: target,
                        goldenScenario: scenarioDir.name,
                        goldenVariant: variant.id.toString(),
                        goldenRunId: goldenRunId,
                        goldenModPack: 'vanilla'
                ])
                startParameter.projectProperties = childProperties
                if (predecessor != null) {
                    mustRunAfter predecessor
                }
            }
            matrixRuns << matrixTask
            matrixCases << [target: target, scenario: scenarioDir.name, variant: variant.id.toString()]
            previousMatrixRun = matrixTask
        }
    }
}

tasks.register('prodGoldenMatrix') {
    group = 'verification'
    description = 'Runs every selected target/scenario/variant sequentially with production JARs.'
    dependsOn matrixRuns
}

tasks.register('prodGoldenMatrixReview') {
    group = 'verification'
    description = 'Runs the production matrix and prepares HTML plus Blender visual review evidence.'
    dependsOn 'prodGoldenMatrix'
    finalizedBy 'renderGoldenReview'
}

def repeatRuns = []
def previousRepeatRun = null
matrixCases.findAll { definition ->
    (definition.scenario == 'vanilla_smoke' && definition.variant == 'default')
            || (definition.scenario == 'render_features' && definition.variant == 'default')
            || (definition.target == 'fabric-1.21.11'
                    && definition.scenario == 'banner_atlas'
                    && definition.variant == 'atlas_on')
}.each { definition ->
    (2..3).each { repeat ->
        def suffix = "${definition.target}_${definition.scenario}_${definition.variant}_${repeat}"
                .replaceAll('[^A-Za-z0-9_]', '_')
        def predecessor = previousRepeatRun
        def repeatTask = tasks.register("prodGoldenRepeat_${suffix}", GradleBuild) {
            group = 'verification/determinism'
            description = "Repeat ${repeat} for ${definition.target}/${definition.scenario}/${definition.variant}."
            dir = rootProject.projectDir
            tasks = ['prodGolden']
            def childProperties = new LinkedHashMap<String, String>()
            gradle.startParameter.projectProperties.each { key, value ->
                childProperties[key.toString()] = value.toString()
            }
            childProperties.putAll([
                    goldenTarget: definition.target,
                    goldenScenario: definition.scenario,
                    goldenVariant: definition.variant,
                    goldenRepeat: repeat.toString(),
                    goldenRunId: goldenRunId,
                    goldenModPack: 'vanilla'
            ])
            startParameter.projectProperties = childProperties
            mustRunAfter rootProject.tasks.named('prodGoldenMatrix')
            if (predecessor != null) {
                mustRunAfter predecessor
            }
        }
        repeatRuns << repeatTask
        previousRepeatRun = repeatTask
    }
}

tasks.register('verifyGoldenDeterminism') {
    group = 'verification'
    description = 'Checks that critical scenarios have identical semantic hashes across three runs.'
    dependsOn ':verification:classes'
    doLast {
        javaexec {
            classpath = project(':verification').sourceSets.main.runtimeClasspath
            mainClass = 'com.voxelbridge.verification.GoldenReviewCli'
            args 'verify-determinism',
                    '--runs', layout.buildDirectory.dir('golden-runs').get().asFile.absolutePath,
                    '--run-id', goldenRunId,
                    '--repeats', '3'
        }
    }
}

tasks.register('prodGoldenDeterminism') {
    group = 'verification'
    description = 'Runs repeat 2 and 3 for critical matrix cases and compares all three outputs.'
    dependsOn 'prodGoldenMatrix'
    dependsOn repeatRuns
    finalizedBy 'verifyGoldenDeterminism'
}

def modMatrixDefinitions = [
        [target: 'fabric-1.21.11', scenario: 'render_features', variant: 'atlas',
         pack: 'fabric-1.21.11-continuity'],
        [target: 'fabric-1.21.11', scenario: 'render_features', variant: 'atlas',
         pack: 'fabric-1.21.11-render-stack'],
        [target: 'neoforge-1.21.1', scenario: 'vanilla_smoke', variant: 'default',
         pack: 'neoforge-1.21.1-yuushya']
]
def modMatrixRuns = []
def previousModRun = null
modMatrixDefinitions.each { definition ->
    def taskSuffix = definition.pack.replaceAll('[^A-Za-z0-9_]', '_')
    def predecessor = previousModRun
    def modTask = tasks.register("prodGoldenModCase_${taskSuffix}", GradleBuild) {
        group = 'verification/mod-matrix'
        description = "Runs locked representative Mod pack ${definition.pack}."
        dir = rootProject.projectDir
        tasks = ['prodGolden']
        def childProperties = new LinkedHashMap<String, String>()
        gradle.startParameter.projectProperties.each { key, value ->
            childProperties[key.toString()] = value.toString()
        }
        childProperties.putAll([
                goldenTarget: definition.target,
                goldenScenario: definition.scenario,
                goldenVariant: definition.variant,
                goldenRunId: goldenRunId,
                goldenModPack: definition.pack
        ])
        startParameter.projectProperties = childProperties
        mustRunAfter rootProject.tasks.named('prodGoldenDeterminism')
        if (predecessor != null) {
            mustRunAfter predecessor
        }
    }
    modMatrixRuns << modTask
    previousModRun = modTask
}

tasks.register('prodGoldenModMatrix') {
    group = 'verification'
    description = 'Runs Continuity, Sodium/Iris/Continuity, and Yuushya representative compatibility packs.'
    dependsOn modMatrixRuns
}

tasks.register('prodGoldenRelease') {
    group = 'verification'
    description = 'Runs vanilla and representative Mod production matrices, renders review evidence, and enforces approvals.'
    dependsOn 'prodGoldenDeterminism', 'prodGoldenModMatrix'
    finalizedBy 'renderGoldenReview', 'verifyGoldenReleaseReview'
}

tasks.named('check').configure {
    dependsOn 'testFast'
}

subprojects { subproj ->
    if (subproj.path.startsWith(':neoforge:mc-') && subproj.name != "mc-${activeMc}") {
        subproj.tasks.configureEach { task ->
            task.enabled = false
        }
    }
}

gradle.projectsEvaluated {
    if (goldenTarget != null) {
        if (!goldenScenarioFile.isFile() || !goldenManifestFile.isFile()) {
            throw new GradleException("Missing golden scenario files under ${goldenScenarioDir}")
        }
        if (goldenVariant == null) {
            throw new GradleException("Unknown -PgoldenVariant=${goldenVariantName} for ${goldenScenario}")
        }
        def manifest = effectiveGoldenManifest()
        def pos1 = manifest.selection.min.join(',')
        def pos2 = manifest.selection.max.join(',')
        def settleTicks = (manifest.settleTicks ?: 40) as int
        def exportConfig = manifest.export ?: [:]
        def exportThreadCount = exportConfig.threadCount ?: 1
        def atlasMode = exportConfig.atlasMode ?: 'individual'
        def coordinateMode = exportConfig.coordinateMode ?: 'centered'
        def exportDoubleSided = exportConfig.containsKey('exportDoubleSided')
                ? exportConfig.exportDoubleSided
                : true
        def nonsolidCulling = exportConfig.containsKey('nonsolidCulling')
                ? exportConfig.nonsolidCulling
                : true
        def targetProject = project(goldenTarget.projectPath)
        def jarTaskName = goldenTarget.platform == 'fabric' ? 'remapJar' : 'shadowJar'
        def productionJar = targetProject.tasks.named(jarTaskName).get().archiveFile.get().asFile
        def goldenJvmArgs = [
                "-Dvoxelbridge.clientAutomationClass=com.voxelbridge.client.GoldenTestController",
                "-Dvoxelbridge.golden.enabled=true",
                "-Dvoxelbridge.golden.requireProductionJar=true",
                "-Dvoxelbridge.golden.expectedJar=${productionJar.absolutePath}",
                "-Dvoxelbridge.golden.scenarioFile=${goldenScenarioFile.absolutePath}",
                "-Dvoxelbridge.golden.resultFile=${goldenResultFile.absolutePath}",
                "-Dvoxelbridge.golden.exportDir=${goldenExportDir.absolutePath}",
                "-Dvoxelbridge.golden.pos1=${pos1}",
                "-Dvoxelbridge.golden.pos2=${pos2}",
                "-Dvoxelbridge.golden.settleTicks=${settleTicks}",
                "-Dvoxelbridge.golden.minecraftVersion=${goldenTarget.minecraft}",
                "-Dvoxelbridge.golden.exportThreadCount=${exportThreadCount}",
                "-Dvoxelbridge.golden.atlasMode=${atlasMode}",
                "-Dvoxelbridge.golden.coordinateMode=${coordinateMode}",
                "-Dvoxelbridge.golden.exportDoubleSided=${exportDoubleSided}",
                "-Dvoxelbridge.golden.nonsolidCulling=${nonsolidCulling}",
                "-Dvoxelbridge.golden.logging=true",
                "-Dvoxelbridge.probe.enabled=true",
                "-Dvoxelbridge.golden.timeoutSeconds=${manifest.performanceBudget?.timeoutSeconds ?: 300}",
                "-Dvoxelbridge.golden.autoStop=true"
        ]
        if (goldenScenario == 'banner_atlas') {
            // Force the structured production-mapped texture path for the
            // historical banner atlas regression.
            goldenJvmArgs += [
                    '-Dvoxelbridge.renderType.requireStructuredTexture=true',
                    '-Dvoxelbridge.banner.forceAtlasUvFallback=true'
            ]
        }
        if (goldenTarget.platform == 'neoforge') {
            targetProject.tasks.named('installGoldenProductionMod').configure {
                mustRunAfter rootProject.tasks.named('prepareGoldenMods')
            }
        }
        def runTask = targetProject.tasks.named('runGoldenProductionClient')
        runTask.configure {
            dependsOn rootProject.tasks.named('prepareGoldenWorld')
            if (goldenTarget.platform == 'fabric') {
                if (goldenModPackName != 'vanilla') {
                    mods.from(resolvedGoldenModArtifacts().collect { it.file })
                }
                jvmArgs.addAll(goldenJvmArgs)
                programArgs.addAll('--quickPlaySingleplayer', goldenWorldName)
            } else {
                jvmArgs(goldenJvmArgs)
                args '--quickPlaySingleplayer', goldenWorldName
            }
        }
    }
}
