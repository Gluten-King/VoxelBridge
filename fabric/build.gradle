plugins {
    // Use a recent Loom release compatible with MC 1.21.1 and Gradle 9
    id 'fabric-loom' version '1.10.0-alpha.13'
    id 'maven-publish'
}

def activeFabricMc = (project.findProperty('active_fabric_mc') ?: '1.21.1').toString()
def mcProject = project(":mc-${activeFabricMc}-fabric")

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://maven.fabricmc.net' }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-fabric"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings "net.fabricmc:yarn:${fabric_yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Pull the full Fabric API to keep module versions in sync and avoid mixin mismatches
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "ar.com.hjg:pngj:2.1.0"
    implementation "net.sf.trove4j:trove4j:3.0.3"

    def jgltfVersion = '2.0.4'
    implementation "de.javagl:jgltf-model:${jgltfVersion}"
    implementation "de.javagl:jgltf-impl-v1:${jgltfVersion}"
    implementation "de.javagl:jgltf-impl-v2:${jgltfVersion}"

    def jacksonDatabindVersion = '2.13.4.2'
    def jacksonCoreVersion = '2.13.4'
    def jacksonAnnotationsVersion = '2.13.4'
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonAnnotationsVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonCoreVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
}

sourceSets {
    main {
        java.srcDirs = [
            "${mcProject.projectDir}/src/main/java",
            "${rootProject.projectDir}/core/src/main/java"
        ]
        resources.srcDirs = [ "${mcProject.projectDir}/src/main/resources" ]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_description', mod_description
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_license', mod_license
    inputs.property 'fabric_loader_version', fabric_loader_version
    inputs.property 'fabric_minecraft_version', fabric_minecraft_version
    filesMatching('fabric.mod.json') {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_description: mod_description,
            mod_authors: mod_authors,
            mod_license: mod_license,
            fabric_loader_version: fabric_loader_version,
            fabric_minecraft_version: fabric_minecraft_version
        )
    }
}

loom {
    runs {
        client {
            client()
            name = "Fabric Client"
        }
    }
}
