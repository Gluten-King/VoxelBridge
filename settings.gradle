pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

import groovy.json.JsonSlurper

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'voxelbridge'

include 'shared:core', 'shared:pipeline', 'verification'
project(':shared').projectDir = file('shared')
project(':shared:core').projectDir = file('core')
project(':shared:pipeline').projectDir = file('pipeline')
project(':verification').projectDir = file('verification')

def targetRegistry = new JsonSlurper().parse(file('gradle/targets.json'))
gradle.ext.voxelBridgeTargetRegistry = targetRegistry
gradle.ext.voxelBridgeTargetsByProject = targetRegistry.targets.collectEntries {
    [(it.projectPath.toString()): it]
}
targetRegistry.targets*.minecraft*.toString().unique().each { minecraftVersion ->
    def runtimePath = ":runtime:minecraft:mc-${minecraftVersion}"
    include runtimePath
    project(runtimePath).projectDir = file("runtime/minecraft/${minecraftVersion}")
}
targetRegistry.targets.each { target ->
    include target.projectPath
    project(target.projectPath).projectDir = file(target.projectDir)
}
