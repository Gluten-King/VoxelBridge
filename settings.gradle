pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'voxelbridge'

include 'shared:core', 'shared:common'
project(':shared').projectDir = file('shared')
project(':shared:core').projectDir = file('core')
project(':shared:common').projectDir = file('common')

if (file('fabric/26.1.2/mod').exists()) {
    include 'fabric:26.1.2:mod'
    project(':fabric:26.1.2:mod').projectDir = file('fabric/26.1.2/mod')
}

if (file('fabric/26.2/mod').exists()) {
    include 'fabric:26.2:mod'
    project(':fabric:26.2:mod').projectDir = file('fabric/26.2/mod')
}
