plugins {
    id 'java'
    id 'application'
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // Match the version already shipped by the mod projects so verification can
    // run from the existing Gradle cache in restricted/offline environments.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
    testImplementation project(':shared:core')
    testImplementation project(':shared:pipeline')
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
}

application {
    mainClass = 'com.voxelbridge.verification.GoldenCli'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('goldenSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free semantic glTF verifier tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.voxelbridge.verification.SemanticGltfAnalyzerTest'
}

tasks.register('goldenReviewSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs hash-bound golden review workflow tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.voxelbridge.verification.GoldenReviewCliTest'
}

tasks.register('quadGeometryKeySelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs double-sided quad collapse identity regression tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.voxelbridge.verification.QuadGeometryKeyTest'
}

tasks.register('pipelineContractSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs version-neutral pipeline contract and session tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.voxelbridge.verification.PipelineContractTest'
}

tasks.test {
    dependsOn 'goldenSelfTest', 'goldenReviewSelfTest', 'quadGeometryKeySelfTest', 'pipelineContractSelfTest'
    // These verification classes are dependency-free main-method self tests,
    // so Gradle 9's JUnit discovery intentionally finds no test descriptors.
    failOnNoDiscoveredTests = false
}

def cliArgs = { String command ->
    def gltf = providers.gradleProperty('gltf').orNull
    if (!gltf) {
        throw new GradleException('Missing -Pgltf=<path-to-gltf>')
    }

    def result = [command, '--gltf', rootProject.file(gltf).absolutePath]
    if (command == 'generate') {
        def snapshot = providers.gradleProperty('snapshot').orNull
        if (!snapshot) {
            throw new GradleException('Missing -Psnapshot=<output-snapshot>')
        }
        result += ['--snapshot', rootProject.file(snapshot).absolutePath]
    } else if (command == 'verify') {
        def expected = providers.gradleProperty('expected').orNull
        if (!expected) {
            throw new GradleException('Missing -Pexpected=<expected-snapshot>')
        }
        result += ['--expected', rootProject.file(expected).absolutePath]
        def actual = providers.gradleProperty('actual').orNull
        if (!actual) {
            actual = layout.buildDirectory.file('reports/golden/actual.snapshot.json').get().asFile.absolutePath
        }
        result += ['--actual', rootProject.file(actual).absolutePath]
    }

    result += [
        '--scenario', providers.gradleProperty('scenario').orElse('unknown').get(),
        '--minecraft', providers.gradleProperty('minecraftVersion').orElse('unknown').get()
    ]

    def scenarioFile = providers.gradleProperty('scenarioFile').orNull
    if (scenarioFile) {
        result += ['--scenario-file', rootProject.file(scenarioFile).absolutePath]
    }
    def scenarioManifest = providers.gradleProperty('scenarioManifest').orNull
    if (scenarioManifest) {
        result += ['--scenario-manifest', rootProject.file(scenarioManifest).absolutePath]
    }
    return result
}

tasks.register('generateGoldenSnapshot', JavaExec) {
    group = 'verification'
    description = 'Generates a canonical semantic snapshot from glTF and its external assets.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    doFirst {
        args = cliArgs('generate')
    }
}

tasks.register('verifyGoldenSnapshot', JavaExec) {
    group = 'verification'
    description = 'Compares a glTF semantic snapshot with a committed golden snapshot.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    doFirst {
        args = cliArgs('verify')
    }
}

tasks.register('inspectGltfSnapshot', JavaExec) {
    group = 'verification'
    description = 'Prints a semantic glTF report and evaluates optional scenario assertions.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    doFirst {
        args = cliArgs('inspect')
    }
}

tasks.register('diffGoldenSnapshot', JavaExec) {
    group = 'verification'
    description = 'Writes a structured semantic diff between two golden snapshots.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.voxelbridge.verification.GoldenReviewCli'
    doFirst {
        def expected = providers.gradleProperty('expected').orNull
        def actual = providers.gradleProperty('actual').orNull
        def output = providers.gradleProperty('diffOutput').orNull
        if (!expected || !actual || !output) {
            throw new GradleException(
                    'diffGoldenSnapshot requires -Pexpected, -Pactual, and -PdiffOutput.')
        }
        args = [
                'diff',
                '--expected', rootProject.file(expected).absolutePath,
                '--actual', rootProject.file(actual).absolutePath,
                '--output', rootProject.file(output).absolutePath
        ]
    }
}
